name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full release shard
        run: SLOW=4 SHARD_INDEX=${{ matrix.shard }} SHARD_TOTAL=4 node test/release.mjs

  coop-gate:
    name: coop-gate (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full coop shard
        run: SLOW=4 RETRY=1 SHARD_INDEX=${{ matrix.shard }} SHARD_TOTAL=4 node test/coop-release.mjs

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Version sync
        run: node test/version-sync.mjs
      - name: Relay reconnect edge
        run: SLOW=4 node test/relay-reconnect.mjs || (echo "retry relay-reconnect" && SLOW=4 node test/relay-reconnect.mjs)
      - name: Start static server
        run: python3 -m http.server 8741 &
      - name: Smoke
        run: node test/smoke.mjs
      - name: Version check
        run: node test/version-check.mjs
      - name: Cloud save and policy
        run: SLOW=4 node test/cloudsave.mjs || (echo "retry cloudsave" && SLOW=4 node test/cloudsave.mjs)
      - name: i18n
        run: node test/i18n.mjs
      - name: Coop damage
        run: node test/coop-damage.mjs
      - name: Coop roster trust boundary
        run: node test/coop-nick.mjs
      - name: Save migration
        run: node test/save-migration.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8741 &
      - name: UKR campaign
        timeout-minutes: 45
        run: SLOW=4 node test/e2e.mjs

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release-gate, coop-gate, smoke, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
