name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate:
    if: github.event_name == 'workflow_dispatch'
    name: release-gate (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full release shard
        run: SLOW=4 SHARD_INDEX=${{ matrix.shard }} SHARD_TOTAL=4 node test/release.mjs

  coop-gate:
    if: github.event_name == 'workflow_dispatch'
    name: coop-gate (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full coop shard
        run: SLOW=4 RETRY=1 SHARD_INDEX=${{ matrix.shard }} SHARD_TOTAL=4 node test/coop-release.mjs

  # Секундні гейти без браузера: жоден крок тут не піднімає Chromium,
  # тому playwright install не потрібен — локально весь набір < 1 с.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version sync
        run: node test/version-sync.mjs
      - name: Service worker shell and i18n parity
        run: node test/sw-cache.mjs && node test/i18n-parity.mjs
      - name: Community schema and API
        run: node test/community-schema.mjs && node test/community-api.mjs
      - name: Fast domain units
        run: node --test test/worldfront-unit.mjs test/worldevents.mjs test/expedition-unit.mjs test/season-unit.mjs test/squad-unit.mjs test/combat-momentum-unit.mjs test/runbuild-unit.mjs test/runmults-unit.mjs test/countrypowers-unit.mjs test/tier2-unit.mjs test/stars-unit.mjs test/gadgetguard-unit.mjs test/relay-allowlist.mjs test/megaquest-unit.mjs test/projectile-floor-unit.mjs test/missionpool-prompt-unit.mjs test/clone-squad-unit.mjs test/exploder-chain-unit.mjs test/draft-gating-unit.mjs test/compass-order-unit.mjs test/sharecard-unit.mjs test/first-steps-unit.mjs test/stickers-unit.mjs test/guest-trust-unit.mjs test/squad-owner-unit.mjs test/squad-net-unit.mjs test/host-event-order-unit.mjs
      # окремим кроком: League-шим тримає таблицю на node:sqlite (на Node 22 — за прапорцем)
      - name: Relay worker guards
        run: node --experimental-sqlite --test test/relay-worker-unit.mjs

  # Блокує деплой разом із quick: тут гра справді стартує в Chromium.
  # Статичний сервер піднімає сам тест (ensureWebServer у test/_server.mjs),
  # окремий крок із python3 -m http.server не потрібен.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Game smoke
        timeout-minutes: 8
        run: npm test
      - name: Combat Reborn
        timeout-minutes: 6
        run: node test/combat-reborn.mjs
      - name: Save migration
        timeout-minutes: 8
        run: node test/save-migration.mjs

  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 8741 &
      - name: UKR campaign
        timeout-minutes: 45
        run: SLOW=4 node test/e2e.mjs

  expedition:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Solo expedition
        run: npm run test:expedition
      - name: Coop expedition
        run: npm run test:coop-expedition

  front:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: World Front domain, browser, mobile, metrics and co-op
        run: npm run test:front

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quick, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
