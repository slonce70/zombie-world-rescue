<script type="module">
import * as THREE from 'three';

// ---------- сцена ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd3e6);
scene.fog = new THREE.Fog(0xbcd3e6, 12, 24);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 60);
scene.add(new THREE.HemisphereLight(0xd8ecff, 0x8aa070, 0.9));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(4, 6, -3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -5;
sun.shadow.camera.right = sun.shadow.camera.top = 5;
scene.add(sun);

const grad = new THREE.DataTexture(new Uint8Array([90, 160, 215, 255]), 4, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter;
grad.needsUpdate = true;
const matCache = new Map();
const toon = (c) => {
  if (!matCache.has(c)) matCache.set(c, new THREE.MeshToonMaterial({ color: c, gradientMap: grad, dithering: true }));
  return matCache.get(c);
};
const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 48), toon(0xcfe0c4));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- помощники ----------
const sph = (r, c, w = 20, h = 14) => new THREE.Mesh(new THREE.SphereGeometry(r, w, h), toon(c));
const boxm = (w, h, d, c) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toon(c));
const caps = (r, l, c) => new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 5, 14), toon(c));
const torusm = (R, r, c, arc = Math.PI * 2) => new THREE.Mesh(new THREE.TorusGeometry(R, r, 10, 32, arc), toon(c));
const conem = (r, h, c) => new THREE.Mesh(new THREE.ConeGeometry(r, h, 10), toon(c));
const flat = (m) => { m.rotation.x = Math.PI / 2; return m; };
function jag(geo, yMin, base, amp, freq) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    if (p.getY(i) < yMin) {
      const a = Math.atan2(p.getZ(i), p.getX(i));
      p.setY(i, p.getY(i) - base - amp * Math.abs(Math.sin(freq * a + 0.7)));
      p.setX(i, p.getX(i) * 1.06); p.setZ(i, p.getZ(i) * 1.06);
    }
  }
  geo.computeVertexNormals();
  return geo;
}
const outM = new THREE.MeshBasicMaterial({ color: 0x1e2a18, side: THREE.BackSide });
function outline(root, th = 0.018) {
  root.traverse((o) => {
    if (!o.isMesh || o.material.isMeshBasicMaterial || o.userData.noOut) return;
    o.castShadow = true;
    o.geometry.computeBoundingSphere();
    const size = o.geometry.boundingSphere.radius * Math.max(o.scale.x, o.scale.y, o.scale.z);
    if (size < 0.055) return;
    const out = new THREE.Mesh(o.geometry, outM);
    out.scale.setScalar(1 + th / size);
    o.add(out);
  });
}
const SKIN = 0x7ed957, SKIN_D = 0x55a83e, HAIR = 0x3e7a2e, DARK = 0x20261e, WHITE = 0xffffff;

// ============================================================
// 1. PIXAR-МУЛЬТ (наш прошлый прототип, слегка ужат)
// ============================================================
function buildPixar() {
  const root = new THREE.Group(), body = new THREE.Group();
  root.add(body);
  const P = {}, F = { eyes: [], pupils: [] };
  for (const s of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(0.15 * s, 0.66, 0);
    const pant = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.115, 0.42, 20), toon(0x4a4e69));
    pant.position.y = -0.18;
    const cuff = flat(torusm(0.115, 0.033, 0x4a4e69)); cuff.position.y = -0.40;
    const sole = boxm(0.25, 0.06, 0.42, 0x4e342e); sole.position.set(0, -0.625, -0.03);
    const shoe = sph(1, 0x8b5e3c); shoe.scale.set(0.115, 0.10, 0.20); shoe.position.set(0, -0.56, -0.03);
    const toe = sph(1, WHITE); toe.scale.set(0.075, 0.07, 0.075); toe.position.set(0, -0.555, -0.185);
    g.add(pant, cuff, sole, shoe, toe);
    body.add(g); P[s < 0 ? 'legL' : 'legR'] = g;
  }
  const torso = new THREE.Group(); torso.position.y = 0.66;
  const shirt = new THREE.Mesh(jag(new THREE.CylinderGeometry(0.29, 0.33, 0.55, 48, 1), -0.26, 0.02, 0.045, 3.5), toon(0x7a6fd0));
  shirt.scale.set(1.05, 1, 0.88); shirt.position.y = 0.19;
  const belt = flat(torusm(0.315, 0.03, DARK)); belt.scale.set(1.05, 0.88, 1); belt.position.y = -0.02;
  const buckle = boxm(0.07, 0.06, 0.035, 0xd9a441); buckle.position.set(0, -0.02, -0.30);
  const collar = flat(torusm(0.135, 0.045, 0x5f55b8)); collar.position.y = 0.44;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 0.18, 14), toon(SKIN));
  neck.position.y = 0.48;
  torso.add(shirt, belt, buckle, collar, neck);
  body.add(torso); P.torso = torso;
  for (const s of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(0.33 * s, 0.40, -0.03);
    const shoulder = sph(0.115, 0x7a6fd0);
    const sleeve = new THREE.Mesh(jag(new THREE.CylinderGeometry(0.095, 0.10, 0.28, 20, 1), -0.13, 0.01, 0.03, 4), toon(0x7a6fd0));
    sleeve.position.y = -0.12;
    const fore = caps(0.075, 0.20, SKIN); fore.position.y = -0.36;
    const palm = sph(0.095, SKIN); palm.scale.set(1, 1.25, 0.7); palm.position.y = -0.53;
    g.add(shoulder, sleeve, fore, palm);
    for (let i = 0; i < 3; i++) {
      const f = sph(0.028, SKIN, 10, 8); f.scale.set(1, 2.1, 1.05);
      f.position.set((i - 1) * 0.055, i === 1 ? -0.655 : -0.635, 0);
      g.add(f);
    }
    torso.add(g); P[s < 0 ? 'armL' : 'armR'] = g;
  }
  const head = new THREE.Group(); head.position.y = 0.52;
  const HX = 0.44, HY = 0.38, HZ = 0.42, HCY = 0.30;
  const fz = (x, y, off = 0) => {
    const t = 1 - (x / HX) ** 2 - ((y - HCY) / HY) ** 2;
    return -(HZ * Math.sqrt(Math.max(t, 0)) + off);
  };
  const skull = sph(1, SKIN, 36, 26); skull.scale.set(HX, HY, HZ); skull.position.y = HCY;
  const cheeks = sph(1, SKIN, 28, 20); cheeks.scale.set(0.34, 0.24, 0.30); cheeks.position.set(0, 0.14, -0.05);
  const nose = sph(1, SKIN, 14, 12); nose.scale.set(0.075, 0.055, 0.06); nose.position.set(0, 0.27, fz(0, 0.27, 0.02));
  head.add(skull, cheeks, nose);
  for (const [s, r, rp] of [[1, 0.11, 0.048], [-1, 0.085, 0.040]]) {
    const eg = new THREE.Group();
    eg.position.set(0.16 * s, s > 0 ? 0.37 : 0.35, fz(0.16 * s, 0.36) + r * 0.42);
    const white = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 18), new THREE.MeshToonMaterial({ color: WHITE, gradientMap: grad }));
    const pupil = sph(rp, DARK, 16, 12); pupil.position.z = -(r - 0.012);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 6), new THREE.MeshBasicMaterial({ color: WHITE }));
    glint.position.set(0.035, 0.04, -(r + 0.002));
    eg.add(white, pupil, glint);
    head.add(eg); F.eyes.push(eg); F.pupils.push(pupil);
  }
  const lid = sph(1, SKIN, 20, 14); lid.scale.set(0.118, 0.075, 0.118);
  lid.position.set(0.16, 0.455, fz(0.16, 0.38) + 0.05);
  const browL = boxm(0.11, 0.03, 0.035, HAIR); browL.position.set(0.17, 0.52, fz(0.17, 0.52, 0.02)); browL.rotation.set(-0.3, 0, 0.17);
  const browR = boxm(0.10, 0.03, 0.035, HAIR); browR.position.set(-0.16, 0.49, fz(-0.16, 0.49, 0.02)); browR.rotation.set(-0.3, 0, -0.28);
  head.add(lid, browL, browR);
  const mc = new THREE.Vector3(0.005, 0.155, fz(0.005, 0.15, 0.012));
  const smilePts = [[-0.115, 0.185], [-0.05, 0.14], [0.01, 0.125], [0.08, 0.14], [0.13, 0.19]]
    .map(([px, py]) => new THREE.Vector3(px, py, fz(px, py, 0.012)).sub(mc));
  const smile = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(smilePts), 20, 0.019, 8), toon(0x2c4426));
  smile.position.copy(mc);
  const t1 = boxm(0.05, 0.06, 0.035, WHITE); t1.position.set(0.06, 0.095, fz(0.06, 0.095, 0.01));
  const t2 = boxm(0.045, 0.055, 0.035, WHITE); t2.position.set(-0.04, 0.10, fz(-0.04, 0.10, 0.01));
  head.add(smile, t1, t2); F.smile = smile;
  for (const s of [-1, 1]) {
    const blush = sph(1, 0xa8e063, 12, 10); blush.scale.set(0.075, 0.05, 0.035);
    blush.position.set(0.27 * s, 0.20, fz(0.27 * s, 0.20, 0.004));
    blush.userData.noOut = true;
    head.add(blush);
  }
  for (const [tx, tz] of [[0, 0.06], [0.13, -0.03], [-0.14, 0.05], [0.07, 0.18], [-0.06, -0.12], [0.20, 0.14], [-0.20, 0.12]]) {
    const t = 1 - (tx / HX) ** 2 - (tz / HZ) ** 2;
    const c = conem(0.05 + Math.abs(tx) * 0.06, 0.18, HAIR);
    c.position.set(tx, HCY + HY * Math.sqrt(Math.max(t, 0)) + 0.03, tz);
    c.rotation.set(tz * 1.4, 0, -tx * 1.4);
    head.add(c);
  }
  torso.add(head); P.head = head;
  outline(root);
  return { group: root, body, P, F };
}
function tickPixar(z, dt, t) {
  const { P, F, S } = z, a = S.amp;
  S.phase += dt * 4.4 * a;
  const ph = S.phase;
  P.legL.rotation.x = Math.sin(ph) * 0.55 * a;
  P.legR.rotation.x = Math.sin(ph + Math.PI) * 0.55 * a;
  z.body.position.y = Math.abs(Math.sin(ph)) * 0.055 * a;
  const sq = 1 + Math.sin(2 * ph + 0.7) * 0.035 * a + Math.sin(t * 2.1) * 0.012 * (1 - a);
  z.body.scale.set(1 + (1 - sq) * 0.55, sq, 1 + (1 - sq) * 0.55);
  z.body.rotation.x = -0.10 * a;
  z.body.rotation.z = Math.sin(ph) * 0.055 * a;
  const fwd = 1.28 * a + 1.1 * (1 - a);
  P.armL.rotation.x = fwd + Math.sin(ph + 0.4) * 0.16 * a + Math.sin(t * 1.3) * 0.05 * (1 - a);
  P.armR.rotation.x = fwd * 0.92 + Math.sin(ph + Math.PI * 0.9) * 0.19 * a + Math.cos(t * 1.1) * 0.05 * (1 - a);
  P.head.rotation.z = Math.sin(ph * 0.5 + 1) * 0.09 * a + Math.sin(t * 0.6) * 0.05 * (1 - a);
  P.head.rotation.x = Math.sin(2 * ph) * 0.05 * a - 0.04;
  if (S.attackT >= 0) {
    S.attackT += dt / 0.6;
    const k = S.attackT;
    if (k >= 1) { S.attackT = -1; F.smile.scale.set(1, 1, 1); }
    else {
      const up = Math.sin(Math.min(k * 2.4, 1) * Math.PI / 2);
      const chop = k > 0.42 ? Math.sin((k - 0.42) / 0.58 * Math.PI) : 0;
      P.armL.rotation.x = fwd + up * 0.8 - chop * 1.5;
      P.armR.rotation.x = fwd + up * 0.9 - chop * 1.6;
      z.body.position.z = -Math.sin(k * Math.PI) * 0.3;
      F.smile.scale.set(1, 1 + up * 0.8, 1);
    }
  } else z.body.position.z = 0;
  blinkAndGaze(z, dt, 0.92);
}

// ============================================================
// 2. ЧИБИ-ИГРУШКА (огромная голова, гигантские глаза)
// ============================================================
function buildChibi() {
  const root = new THREE.Group(), body = new THREE.Group();
  root.add(body);
  const P = {}, F = { eyes: [], pupils: [] };
  for (const s of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(0.10 * s, 0.20, 0);
    const leg = caps(0.075, 0.05, 0x5b6ea3); leg.position.y = -0.05;
    const shoe = sph(1, WHITE); shoe.scale.set(0.085, 0.06, 0.115); shoe.position.set(0, -0.155, -0.02);
    g.add(leg, shoe);
    body.add(g); P[s < 0 ? 'legL' : 'legR'] = g;
  }
  const torso = new THREE.Group(); torso.position.y = 0.20;
  const shirt = sph(1, 0x9ef0b6, 24, 18); shirt.scale.set(0.24, 0.21, 0.21); shirt.position.y = 0.16;
  const b1 = sph(0.02, DARK, 8, 6); b1.position.set(0, 0.20, -0.195);
  const b2 = sph(0.02, DARK, 8, 6); b2.position.set(0, 0.11, -0.205);
  torso.add(shirt, b1, b2);
  body.add(torso); P.torso = torso;
  for (const s of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(0.20 * s, 0.26, 0);
    const arm = caps(0.055, 0.09, 0x9ef0b6); arm.position.y = -0.07;
    const mitt = sph(0.065, SKIN); mitt.position.y = -0.16;
    g.add(arm, mitt); g.rotation.z = s * 0.35;
    torso.add(g); P[s < 0 ? 'armL' : 'armR'] = g;
  }
  const head = new THREE.Group(); head.position.y = 0.36;
  const HX = 0.40, HY = 0.37, HZ = 0.35, HCY = 0.33;
  const fz = (x, y, off = 0) => {
    const t = 1 - (x / HX) ** 2 - ((y - HCY) / HY) ** 2;
    return -(HZ * Math.sqrt(Math.max(t, 0)) + off);
  };
  const skull = sph(1, SKIN, 36, 26); skull.scale.set(HX, HY, HZ); skull.position.y = HCY;
  head.add(skull);
  for (const s of [-1, 1]) {
    const eg = new THREE.Group();
    eg.position.set(0.155 * s, 0.36, fz(0.155 * s, 0.36) + 0.06);
    const white = new THREE.Mesh(new THREE.SphereGeometry(0.135, 24, 18), new THREE.MeshToonMaterial({ color: WHITE, gradientMap: grad }));
    white.scale.z = 0.6;
    const pupil = sph(0.082, 0x2e3b2a, 18, 14); pupil.position.z = -0.055;
    const g1 = new THREE.Mesh(new THREE.SphereGeometry(0.034, 10, 8), new THREE.MeshBasicMaterial({ color: WHITE }));
    g1.position.set(0.035, 0.04, -0.115);
    const g2 = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 6), new THREE.MeshBasicMaterial({ color: WHITE }));
    g2.position.set(-0.03, -0.035, -0.115);
    eg.add(white, pupil, g1, g2);
    head.add(eg); F.eyes.push(eg); F.pupils.push(pupil);
  }
  const browL = boxm(0.09, 0.018, 0.02, HAIR); browL.position.set(0.16, 0.55, fz(0.16, 0.55, 0.015)); browL.rotation.z = 0.25;
  const browR = boxm(0.09, 0.018, 0.02, HAIR); browR.position.set(-0.16, 0.54, fz(-0.16, 0.54, 0.015)); browR.rotation.z = -0.32;
  const mouth = sph(1, 0x35502f, 14, 10); mouth.scale.set(0.05, 0.038, 0.02);
  mouth.position.set(0.02, 0.17, fz(0.02, 0.17, 0.012));
  const tooth = boxm(0.028, 0.03, 0.02, WHITE); tooth.position.set(0.02, 0.145, fz(0.02, 0.15, 0.016));
  head.add(browL, browR, mouth, tooth); F.smile = mouth;
  for (const s of [-1, 1]) {
    const blush = sph(1, 0xffb3c1, 12, 10); blush.scale.set(0.07, 0.04, 0.02);
    blush.position.set(0.26 * s, 0.22, fz(0.26 * s, 0.22, 0.006));
    blush.userData.noOut = true;
    head.add(blush);
  }
  const curl = torusm(0.07, 0.022, HAIR, 4.2); // завиток на макушке
  curl.position.set(0.02, HCY + HY + 0.04, 0.02);
  curl.rotation.set(0.4, 0.4, 0.9);
  const band1 = boxm(0.13, 0.025, 0.02, WHITE); band1.position.set(-0.26, 0.52, fz(-0.26, 0.52, 0.012) + 0.05); band1.rotation.z = 0.6;
  const band2 = boxm(0.13, 0.025, 0.02, WHITE); band2.position.copy(band1.position); band2.rotation.z = -0.6; // пластырь ✚
  head.add(curl, band1, band2);
  torso.add(head); P.head = head;
  outline(root, 0.014);
  return { group: root, body, P, F };
}
function tickChibi(z, dt, t) {
  const { P, S } = z, a = S.amp;
  S.phase += dt * 7.5 * a;
  const ph = S.phase;
  P.legL.rotation.x = Math.sin(ph) * 0.7 * a;
  P.legR.rotation.x = Math.sin(ph + Math.PI) * 0.7 * a;
  z.body.position.y = Math.abs(Math.sin(ph)) * 0.05 * a;
  z.body.rotation.z = Math.sin(ph) * 0.09 * a;
  z.body.rotation.x = -0.06 * a;
  const sq = 1 + Math.sin(2 * ph) * 0.05 * a + Math.sin(t * 2.4) * 0.015 * (1 - a);
  z.body.scale.set(1 + (1 - sq) * 0.7, sq, 1 + (1 - sq) * 0.7);
  P.armL.rotation.x = 0.9 * a + Math.sin(ph + 0.5) * 0.25 * a + Math.sin(t * 1.4) * 0.06 * (1 - a);
  P.armR.rotation.x = 0.85 * a + Math.sin(ph + 2.8) * 0.25 * a + Math.cos(t * 1.2) * 0.06 * (1 - a);
  // голова-неваляшка
  P.head.rotation.z = Math.sin(ph * 0.5) * 0.16 * a + Math.sin(t * 0.7) * 0.07 * (1 - a);
  P.head.rotation.x = Math.sin(2 * ph + 1) * 0.06 * a;
  if (S.attackT >= 0) { // прыжок с полным оборотом
    S.attackT += dt / 0.7;
    const k = S.attackT;
    if (k >= 1) { S.attackT = -1; z.body.rotation.y = 0; }
    else {
      z.body.position.y = Math.sin(k * Math.PI) * 0.45;
      z.body.rotation.y = k * Math.PI * 2;
      P.armL.rotation.x = P.armR.rotation.x = 2.2;
      const s2 = 1 - Math.sin(k * Math.PI) * 0.15;
      z.body.scale.set(2 - s2, s2, 2 - s2);
    }
  }
  blinkAndGaze(z, dt, 0.94);
}

// ============================================================
// 3. ПЛЮШ (мягкая игрушка, Fall Guys-желе)
// ============================================================
function buildPlush() {
  const root = new THREE.Group(), body = new THREE.Group();
  root.add(body);
  const P = {}, F = { eyes: [], pupils: [] };
  const GREEN = 0x58d453, ORANGE = 0xffa14a;
  for (const s of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(0.14 * s, 0.10, -0.06);
    const foot = sph(1, ORANGE); foot.scale.set(0.10, 0.055, 0.13); foot.position.y = -0.04;
    g.add(foot);
    body.add(g); P[s < 0 ? 'legL' : 'legR'] = g;
  }
  const torso = new THREE.Group(); torso.position.y = 0.10;
  const belly = caps(0.34, 0.30, GREEN); belly.position.y = 0.49;
  const patch = sph(1, 0xbef29a, 24, 18); patch.scale.set(0.20, 0.155, 0.05);
  patch.position.set(0, 0.42, -0.30); patch.userData.noOut = true;
  torso.add(belly, patch);
  // шов с крестиками
  for (let i = 0; i < 4; i++) {
    const st = caps(0.008, 0.03, 0x2c6e2a);
    st.position.set(0, 0.86 - i * 0.075, -0.315 + i * 0.012);
    st.rotation.x = 1.25;
    st.userData.noOut = true;
    torso.add(st);
  }
  body.add(torso); P.torso = torso;
  for (const s of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(0.30 * s, 0.64, 0);
    const arm = caps(0.09, 0.16, GREEN); arm.position.y = -0.11;
    const mitt = sph(0.095, ORANGE); mitt.position.y = -0.24;
    g.add(arm, mitt); g.rotation.z = s * 0.8;
    torso.add(g); P[s < 0 ? 'armL' : 'armR'] = g;
  }
  // лицо прямо на теле
  const head = new THREE.Group(); head.position.y = 0.72; // условная «голова» для наклонов
  torso.add(head); P.head = head;
  for (const s of [-1, 1]) {
    const eg = new THREE.Group(); eg.position.set(0.125 * s, 0.06, -0.305);
    const felt = flat(new THREE.Mesh(new THREE.CylinderGeometry(0.082, 0.082, 0.012, 20), toon(WHITE)));
    const eye = new THREE.Mesh(new THREE.SphereGeometry(s > 0 ? 0.052 : 0.042, 16, 12),
      new THREE.MeshToonMaterial({ color: 0x18120c, gradientMap: grad }));
    eye.position.z = -0.02;
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 6), new THREE.MeshBasicMaterial({ color: WHITE }));
    glint.position.set(0.018, 0.02, -0.06);
    eg.add(felt, eye, glint);
    head.add(eg); F.eyes.push(eg); F.pupils.push(eye);
  }
  const mouth = sph(1, 0x3a2a1c, 16, 12); mouth.scale.set(0.105, 0.06, 0.03);
  mouth.position.set(0, -0.10, -0.315);
  const tongue = sph(1, 0xff7d9c, 12, 10); tongue.scale.set(0.05, 0.028, 0.02);
  tongue.position.set(0.01, -0.125, -0.33); tongue.userData.noOut = true;
  head.add(mouth, tongue); F.smile = mouth;
  const pom = sph(0.075, ORANGE); pom.position.set(0, 0.99, 0);
  torso.add(pom);
  for (const s of [-1, 1]) { // висячие ушки
    const ear = conem(0.06, 0.17, GREEN);
    ear.position.set(0.24 * s, 0.92, 0);
    ear.rotation.z = s * 2.4;
    torso.add(ear);
  }
  outline(root, 0.02);
  return { group: root, body, P, F };
}
function tickPlush(z, dt, t) {
  const { P, S } = z, a = S.amp;
  S.phase += dt * 5.2 * a;
  const ph = S.phase;
  // ножек почти нет — прыгает как желе, переваливаясь
  P.legL.rotation.x = Math.sin(ph) * 0.5 * a;
  P.legR.rotation.x = Math.sin(ph + Math.PI) * 0.5 * a;
  z.body.position.y = Math.abs(Math.sin(ph)) * 0.09 * a;
  z.body.rotation.z = Math.sin(ph) * 0.16 * a + Math.sin(t * 1.1) * 0.03 * (1 - a);
  z.body.rotation.x = -0.05 * a;
  const sq = 1 + Math.sin(2 * ph + 0.5) * 0.09 * a + Math.sin(t * 2.8) * 0.025 * (1 - a); // желе!
  z.body.scale.set(1 + (1 - sq) * 0.9, sq, 1 + (1 - sq) * 0.9);
  P.armL.rotation.z = 0.8 + Math.sin(ph + 1) * 0.35 * a + Math.sin(t * 1.6) * 0.08;
  P.armR.rotation.z = -0.8 - Math.sin(ph + 2) * 0.35 * a - Math.cos(t * 1.5) * 0.08;
  P.head.rotation.z = Math.sin(ph * 0.5 + 2) * 0.05 * a;
  if (S.attackT >= 0) { // блинчик: сплющился и бо-о-инг
    S.attackT += dt / 0.75;
    const k = S.attackT;
    if (k >= 1) S.attackT = -1;
    else if (k < 0.4) {
      const s2 = 1 - (k / 0.4) * 0.45;
      z.body.scale.set(2 - s2, s2, 2 - s2);
    } else {
      const j = Math.sin((k - 0.4) / 0.6 * Math.PI);
      z.body.position.y = j * 0.55;
      const s2 = 1 + j * 0.3;
      z.body.scale.set(2 - s2, s2, 2 - s2);
      P.armL.rotation.z = 2.4; P.armR.rotation.z = -2.4;
    }
  }
  blinkAndGaze(z, dt, 0.9);
}

// ============================================================
// 4. ВОКСЕЛЬ-МИНИФИГ (кубики + пиксельное лицо, степ-анимация)
// ============================================================
function pixelFace(blink) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d');
  g.fillStyle = '#7ed957'; g.fillRect(0, 0, 16, 16);
  g.fillStyle = '#20261e';
  if (blink) { g.fillRect(3, 6, 4, 1); g.fillRect(10, 6, 3, 1); }
  else {
    g.fillRect(3, 4, 4, 4); g.fillRect(10, 5, 3, 3);          // глаза разного размера
    g.fillStyle = '#fff'; g.fillRect(4, 5, 2, 2); g.fillRect(11, 6, 1, 1);
    g.fillStyle = '#20261e';
  }
  g.fillRect(4, 11, 8, 1); g.fillRect(6, 12, 2, 1);            // кривой рот
  g.fillStyle = '#fff'; g.fillRect(9, 12, 2, 2);               // зуб
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function buildVoxel() {
  const root = new THREE.Group(), body = new THREE.Group();
  root.add(body);
  const P = {}, F = { eyes: [], pupils: [] };
  for (const s of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(0.085 * s, 0.42, 0);
    const leg = boxm(0.13, 0.28, 0.15, 0x4a4e69); leg.position.y = -0.14;
    const foot = boxm(0.14, 0.09, 0.21, 0x4e342e); foot.position.set(0, -0.24, -0.03);
    g.add(leg, foot);
    body.add(g); P[s < 0 ? 'legL' : 'legR'] = g;
  }
  const torso = new THREE.Group(); torso.position.y = 0.44;
  const hips = boxm(0.30, 0.10, 0.17, 0x39406b); hips.position.y = 0.03;
  const chest = boxm(0.34, 0.36, 0.20, 0x4a8ad4); chest.position.y = 0.26;
  const patch = boxm(0.10, 0.09, 0.02, 0x2e5a8a); patch.position.set(0.08, 0.22, -0.10); patch.rotation.z = 0.2;
  torso.add(hips, chest, patch);
  body.add(torso); P.torso = torso;
  for (const s of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(0.215 * s, 0.42, 0);
    const arm = boxm(0.09, 0.26, 0.09, 0x4a8ad4); arm.position.y = -0.11;
    const hand = boxm(0.10, 0.10, 0.10, SKIN); hand.position.y = -0.27;
    g.add(arm, hand);
    torso.add(g); P[s < 0 ? 'armL' : 'armR'] = g;
  }
  const head = new THREE.Group(); head.position.y = 0.48;
  const faceOpen = pixelFace(false), faceBlink = pixelFace(true);
  const skinT = toon(SKIN);
  const faceM = new THREE.MeshToonMaterial({ map: faceOpen, gradientMap: grad });
  const skullM = [skinT, skinT, skinT, skinT, skinT, faceM]; // лицо на -Z
  const skull = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.26, 0.24), skullM);
  skull.position.y = 0.14;
  const hairCap = boxm(0.27, 0.07, 0.25, HAIR); hairCap.position.y = 0.29;
  const tuft = boxm(0.07, 0.08, 0.07, HAIR); tuft.position.set(0.06, 0.34, 0.02); tuft.rotation.z = 0.3;
  head.add(skull, hairCap, tuft);
  torso.add(head); P.head = head;
  F.faceM = faceM; F.faceOpen = faceOpen; F.faceBlink = faceBlink;
  outline(root, 0.014);
  return { group: root, body, P, F };
}
function tickVoxel(z, dt, t) {
  const { P, F, S } = z, a = S.amp;
  S.phase += dt * 4.0 * a;
  const q = (v, st = 0.3) => Math.round(v / st) * st;  // степ-анимация как в стоп-моушене
  const ph = q(S.phase, 0.5);
  P.legL.rotation.x = Math.sin(ph) * 0.5 * a;
  P.legR.rotation.x = Math.sin(ph + Math.PI) * 0.5 * a;
  z.body.position.y = Math.abs(q(Math.sin(ph), 0.4)) * 0.05 * a;
  z.body.rotation.z = q(Math.sin(ph), 0.5) * 0.05 * a;
  P.armL.rotation.x = q(1.35 * a + Math.sin(ph) * 0.2 * a, 0.15) + q(Math.sin(t * 1.2), 0.6) * 0.04 * (1 - a);
  P.armR.rotation.x = q(1.30 * a + Math.sin(ph + Math.PI) * 0.2 * a, 0.15);
  P.head.rotation.z = q(Math.sin(ph * 0.5), 0.5) * 0.1 * a;
  P.head.rotation.y = q(Math.sin(t * 0.4), 0.4) * 0.15 * (1 - a);
  if (S.attackT >= 0) {
    S.attackT += dt / 0.6;
    const k = S.attackT;
    if (k >= 1) S.attackT = -1;
    else {
      const kq = q(k, 0.2);
      P.armL.rotation.x = P.armR.rotation.x = 1.3 + (kq < 0.4 ? kq * 2 : (1 - kq)) * 1.2;
      z.body.position.z = -q(Math.sin(k * Math.PI), 0.5) * 0.25;
    }
  } else z.body.position.z = 0;
  // пиксельное моргание — смена текстуры
  S.blinkAt -= dt;
  if (S.blinkAt <= 0) { S.blinkAt = 2 + Math.random() * 3; S.blinkT = 0.18; F.faceM.map = F.faceBlink; }
  if (S.blinkT > 0) { S.blinkT -= dt; if (S.blinkT <= 0) F.faceM.map = F.faceOpen; }
}

// общее моргание + блуждающие зрачки (для 1-3)
function blinkAndGaze(z, dt, closeAmt) {
  const S = z.S, F = z.F;
  S.blinkAt -= dt;
  if (S.blinkAt <= 0) { S.blinkAt = 1.8 + Math.random() * 2.5; S.blinkT = 0; }
  if (S.blinkT >= 0) {
    S.blinkT += dt / 0.14;
    const b = S.blinkT >= 1 ? (S.blinkT = -1, 0) : Math.sin(S.blinkT * Math.PI);
    for (const e of F.eyes) e.scale.y = 1 - b * closeAmt;
  }
  S.gazeAt -= dt;
  if (S.gazeAt <= 0) { S.gazeAt = 1.2 + Math.random() * 2; S.gazeTgt.set((Math.random() - 0.5) * 0.05, (Math.random() - 0.5) * 0.035); }
  S.gaze.lerp(S.gazeTgt, Math.min(1, dt * 5));
  for (const p of F.pupils) { p.position.x = S.gaze.x; p.position.y = S.gaze.y; }
}

// ---------- расстановка ----------
const LINEUP = [
  { name: '1. Pixar-мульт', build: buildPixar, tick: tickPixar, x: -2.7, labelY: 2.05, scale: 1 },
  { name: '2. Чиби-игрушка', build: buildChibi, tick: tickChibi, x: -0.9, labelY: 1.95, scale: 1.25 },
  { name: '3. Плюш-желе', build: buildPlush, tick: tickPlush, x: 0.9, labelY: 1.90, scale: 1.3 },
  { name: '4. Воксель-миник', build: buildVoxel, tick: tickVoxel, x: 2.7, labelY: 2.0, scale: 1.15 },
];
const zombies = LINEUP.map((cfg) => {
  const z = cfg.build();
  z.group.position.x = cfg.x;
  z.group.scale.setScalar(cfg.scale);
  scene.add(z.group);
  const tag = document.createElement('div');
  tag.className = 'tag'; tag.textContent = cfg.name;
  document.body.appendChild(tag);
  z.S = {
    amp: 0, phase: Math.random() * 6, blinkAt: 1 + Math.random() * 2, blinkT: -1,
    gazeAt: 1, gaze: new THREE.Vector2(), gazeTgt: new THREE.Vector2(), attackT: -1, atkDelay: 0,
  };
  return Object.assign(z, { cfg, tag });
});

// ---------- управление ----------
let MODE = 'walk';
for (const [id, mode] of Object.entries({ bIdle: 'idle', bWalk: 'walk' })) {
  document.getElementById(id).onclick = () => {
    MODE = mode;
    document.getElementById('bIdle').classList.toggle('on', mode === 'idle');
    document.getElementById('bWalk').classList.toggle('on', mode === 'walk');
  };
}
document.getElementById('bAtk').onclick = () => {
  zombies.forEach((z, i) => { z.S.atkDelay = i * 0.15; });
};
let az = Math.PI, el = 0.17, dist = innerWidth / innerHeight > 1.3 ? 6.5 : 10;
const look = new THREE.Vector3(0, 0.95, 0), lookTgt = look.clone();
let distTgt = dist;
for (const b of document.querySelectorAll('.focus')) {
  b.onclick = () => {
    const x = parseFloat(b.dataset.x);
    lookTgt.set(x, x === 0 ? 0.95 : 0.9, 0);
    distTgt = x === 0 ? (innerWidth / innerHeight > 1.3 ? 6.5 : 10) : 2.8;
  };
}
window.__proto = { setCam(a, e, d) { az = a; if (e != null) el = e; if (d != null) distTgt = dist = d; }, focus(x, d) { lookTgt.x = x; distTgt = d ?? 2.6; }, zombies };
renderer.domElement.addEventListener('pointerdown', () => {
  const move = (ev) => { az -= ev.movementX * 0.006; el = THREE.MathUtils.clamp(el + ev.movementY * 0.005, -0.05, 1.1); };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});
addEventListener('wheel', (e) => { distTgt = THREE.MathUtils.clamp(distTgt + e.deltaY * 0.005, 1.6, 10); });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- цикл ----------
const lerp = (a, b, k) => a + (b - a) * k;
const proj = new THREE.Vector3();
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  for (const z of zombies) {
    z.S.amp = lerp(z.S.amp, MODE === 'walk' ? 1 : 0, Math.min(1, dt * 6));
    if (z.S.atkDelay > 0) { z.S.atkDelay -= dt; if (z.S.atkDelay <= 0 && z.S.attackT < 0) z.S.attackT = 0; }
    z.cfg.tick(z, dt, t + z.cfg.x);
    proj.set(z.cfg.x, z.cfg.labelY, 0).project(camera);
    z.tag.style.left = `${(proj.x * 0.5 + 0.5) * innerWidth}px`;
    z.tag.style.top = `${(-proj.y * 0.5 + 0.5) * innerHeight}px`;
    z.tag.style.display = proj.z < 1 ? 'block' : 'none';
  }
  look.lerp(lookTgt, Math.min(1, dt * 5));
  dist = lerp(dist, distTgt, Math.min(1, dt * 5));
  camera.position.set(look.x + Math.sin(az) * Math.cos(el) * dist, look.y + Math.sin(el) * dist, look.z + Math.cos(az) * Math.cos(el) * dist);
  camera.lookAt(look);
  renderer.render(scene, camera);
});
</script>
</body>
