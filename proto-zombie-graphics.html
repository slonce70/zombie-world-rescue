<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выбор графики — 4 мира одного зомби</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bcd3e6; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui, #gfx { position: fixed; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 2; }
  #ui { top: 12px; }
  #gfx { top: 60px; }
  button {
    border: 0; border-radius: 12px; padding: 9px 14px; font-size: 15px; cursor: pointer;
    background: #ffffffd9; box-shadow: 0 2px 6px #0003; font-weight: 600;
  }
  button.on { background: #7ed957; color: #143a0a; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #33506b; font-size: 13px; z-index: 2; text-shadow: 0 1px 2px #fff8; }
</style>
</head>
<body>
<div id="ui">
  <button id="bIdle">🧟 Стоит</button>
  <button id="bWalk" class="on">🚶 Бредёт</button>
  <button id="bAtk">💥 Атака!</button>
  <button id="bSpin" class="on">🔄 Камера</button>
</div>
<div id="gfx">
  <button class="g on" data-s="0">1 🎬 Мультик</button>
  <button class="g" data-s="1">2 👾 8-бит</button>
  <button class="g" data-s="2">3 🌆 Неон</button>
  <button class="g" data-s="3">4 🏺 Пластилин</button>
</div>
<div id="hint">мышью — крутить, колесом — приближать</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 60);

// ---------- градиенты и текстуры ----------
function gradTex(steps) {
  const t = new THREE.DataTexture(new Uint8Array(steps), steps.length, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}
const grad4 = gradTex([90, 160, 215, 255]);
const grad2 = gradTex([140, 255]); // плоский для 8-бит
const clayBump = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) { // отпечатки пальцев/вмятинки
    const x = Math.random() * 256, y = Math.random() * 256, r = 4 + Math.random() * 14;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const v = Math.random() < 0.5 ? 255 : 0;
    gr.addColorStop(0, `rgba(${v},${v},${v},${0.05 + Math.random() * 0.1})`);
    gr.addColorStop(1, `rgba(${v},${v},${v},0)`);
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();

// ---------- фабрики материалов: одна роль → 4 разных мира ----------
const toonM = (c, g = grad4) => new THREE.MeshToonMaterial({ color: c, gradientMap: g, dithering: true });
const FACT = {
  toon: (c) => toonM(c),
  pixel: (c) => { // ярче и площе
    const col = new THREE.Color(c);
    col.offsetHSL(0, 0.15, 0.04);
    return toonM(col.getHex(), grad2);
  },
  neon: (c, role) => {
    const m = new THREE.MeshBasicMaterial({ color: 0x0d0a18 });
    m.userData.wire = { skin: 0x39ff88, hair: 0x00e5ff, shirt: 0xff3df0, shirtD: 0xff3df0, pants: 0x8a5cff, shoe: 0x8a5cff, sole: 0x8a5cff, gold: 0xffe95c, white: 0xfff6a8, dark: 0x39ff88, mouth: 0xff5c8a, blush: 0 }[role] ?? 0x39ff88;
    return m;
  },
  clay: (c) => {
    const col = new THREE.Color(c);
    col.offsetHSL(0.01, -0.18, 0.06); // пастель
    return new THREE.MeshStandardMaterial({ color: col, roughness: 0.82, bumpMap: clayBump, bumpScale: 0.35 });
  },
};
const ROLES = { skin: 0x7ed957, hair: 0x3e7a2e, shirt: 0x7a6fd0, shirtD: 0x5f55b8, pants: 0x4a4e69, shoe: 0x8b5e3c, sole: 0x4e342e, gold: 0xd9a441, white: 0xffffff, dark: 0x20261e, mouth: 0x2c4426, blush: 0xa8e063 };
function makeMats(kind) {
  const M = {};
  for (const [role, col] of Object.entries(ROLES)) M[role] = FACT[kind](col, role);
  M._kind = kind;
  return M;
}

// ---------- зомби (наш Pixar-рецепт, материалы подставляются) ----------
function buildZombie(M) {
  const root = new THREE.Group(), body = new THREE.Group();
  root.add(body);
  const P = {}, F = { eyes: [], pupils: [] };
  const sph = (r, m, w = 20, h = 14) => new THREE.Mesh(new THREE.SphereGeometry(r, w, h), m);
  const boxm = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  const caps = (r, l, m) => new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 5, 14), m);
  const torusm = (R, r, m) => { const x = new THREE.Mesh(new THREE.TorusGeometry(R, r, 10, 32), m); x.rotation.x = Math.PI / 2; return x; };
  const conem = (r, h, m) => new THREE.Mesh(new THREE.ConeGeometry(r, h, 10), m);
  function jag(geo, yMin, base, amp, freq) {
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      if (p.getY(i) < yMin) {
        const a = Math.atan2(p.getZ(i), p.getX(i));
        p.setY(i, p.getY(i) - base - amp * Math.abs(Math.sin(freq * a + 0.7)));
        p.setX(i, p.getX(i) * 1.06); p.setZ(i, p.getZ(i) * 1.06);
      }
    }
    geo.computeVertexNormals();
    return geo;
  }
  for (const s of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(0.15 * s, 0.66, 0);
    const pant = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.115, 0.42, 20), M.pants);
    pant.position.y = -0.18;
    const cuff = torusm(0.115, 0.033, M.pants); cuff.position.y = -0.40;
    const sole = boxm(0.25, 0.06, 0.42, M.sole); sole.position.set(0, -0.625, -0.03);
    const shoe = sph(1, M.shoe); shoe.scale.set(0.115, 0.10, 0.20); shoe.position.set(0, -0.56, -0.03);
    const toe = sph(1, M.white); toe.scale.set(0.075, 0.07, 0.075); toe.position.set(0, -0.555, -0.185);
    g.add(pant, cuff, sole, shoe, toe);
    body.add(g); P[s < 0 ? 'legL' : 'legR'] = g;
  }
  const torso = new THREE.Group(); torso.position.y = 0.66;
  const shirt = new THREE.Mesh(jag(new THREE.CylinderGeometry(0.29, 0.33, 0.55, 48, 1), -0.26, 0.02, 0.045, 3.5), M.shirt);
  shirt.scale.set(1.05, 1, 0.88); shirt.position.y = 0.19;
  const belt = torusm(0.315, 0.03, M.dark); belt.scale.set(1.05, 0.88, 1); belt.position.y = -0.02;
  const buckle = boxm(0.07, 0.06, 0.035, M.gold); buckle.position.set(0, -0.02, -0.30);
  const collar = torusm(0.135, 0.045, M.shirtD); collar.position.y = 0.44;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 0.18, 14), M.skin);
  neck.position.y = 0.48;
  torso.add(shirt, belt, buckle, collar, neck);
  body.add(torso); P.torso = torso;
  for (const s of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(0.33 * s, 0.40, -0.03);
    const shoulder = sph(0.115, M.shirt);
    const sleeve = new THREE.Mesh(jag(new THREE.CylinderGeometry(0.095, 0.10, 0.28, 20, 1), -0.13, 0.01, 0.03, 4), M.shirt);
    sleeve.position.y = -0.12;
    const fore = caps(0.075, 0.20, M.skin); fore.position.y = -0.36;
    const palm = sph(0.095, M.skin); palm.scale.set(1, 1.25, 0.7); palm.position.y = -0.53;
    g.add(shoulder, sleeve, fore, palm);
    for (let i = 0; i < 3; i++) {
      const f = sph(0.028, M.skin, 10, 8); f.scale.set(1, 2.1, 1.05);
      f.position.set((i - 1) * 0.055, i === 1 ? -0.655 : -0.635, 0);
      g.add(f);
    }
    torso.add(g); P[s < 0 ? 'armL' : 'armR'] = g;
  }
  const head = new THREE.Group(); head.position.y = 0.52;
  const HX = 0.44, HY = 0.38, HZ = 0.42, HCY = 0.30;
  const fz = (x, y, off = 0) => {
    const t = 1 - (x / HX) ** 2 - ((y - HCY) / HY) ** 2;
    return -(HZ * Math.sqrt(Math.max(t, 0)) + off);
  };
  const skull = sph(1, M.skin, 36, 26); skull.scale.set(HX, HY, HZ); skull.position.y = HCY;
  const cheeks = sph(1, M.skin, 28, 20); cheeks.scale.set(0.34, 0.24, 0.30); cheeks.position.set(0, 0.14, -0.05);
  const nose = sph(1, M.skin, 14, 12); nose.scale.set(0.075, 0.055, 0.06); nose.position.set(0, 0.27, fz(0, 0.27, 0.02));
  head.add(skull, cheeks, nose);
  for (const [s, r, rp] of [[1, 0.11, 0.048], [-1, 0.085, 0.040]]) {
    const eg = new THREE.Group();
    eg.position.set(0.16 * s, s > 0 ? 0.37 : 0.35, fz(0.16 * s, 0.36) + r * 0.42);
    const white = sph(r, M.white, 24, 18);
    const pupil = sph(rp, M.dark, 16, 12); pupil.position.z = -(r - 0.012);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    glint.position.set(0.035, 0.04, -(r + 0.002));
    eg.add(white, pupil, glint);
    head.add(eg); F.eyes.push(eg); F.pupils.push(pupil);
  }
  const lid = sph(1, M.skin, 20, 14); lid.scale.set(0.118, 0.075, 0.118);
  lid.position.set(0.16, 0.455, fz(0.16, 0.38) + 0.05);
  const browL = boxm(0.11, 0.03, 0.035, M.hair); browL.position.set(0.17, 0.52, fz(0.17, 0.52, 0.02)); browL.rotation.set(-0.3, 0, 0.17);
  const browR = boxm(0.10, 0.03, 0.035, M.hair); browR.position.set(-0.16, 0.49, fz(-0.16, 0.49, 0.02)); browR.rotation.set(-0.3, 0, -0.28);
  head.add(lid, browL, browR);
  const mc = new THREE.Vector3(0.005, 0.155, fz(0.005, 0.15, 0.012));
  const smilePts = [[-0.115, 0.185], [-0.05, 0.14], [0.01, 0.125], [0.08, 0.14], [0.13, 0.19]]
    .map(([px, py]) => new THREE.Vector3(px, py, fz(px, py, 0.012)).sub(mc));
  const smile = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(smilePts), 20, 0.019, 8), M.mouth);
  smile.position.copy(mc);
  const t1 = boxm(0.05, 0.06, 0.035, M.white); t1.position.set(0.06, 0.095, fz(0.06, 0.095, 0.01));
  const t2 = boxm(0.045, 0.055, 0.035, M.white); t2.position.set(-0.04, 0.10, fz(-0.04, 0.10, 0.01));
  head.add(smile, t1, t2); F.smile = smile;
  for (const s of [-1, 1]) {
    const blush = sph(1, M.blush, 12, 10); blush.scale.set(0.075, 0.05, 0.035);
    blush.position.set(0.27 * s, 0.20, fz(0.27 * s, 0.20, 0.004));
    blush.userData.noOut = true;
    head.add(blush);
  }
  for (const [tx, tz] of [[0, 0.06], [0.13, -0.03], [-0.14, 0.05], [0.07, 0.18], [-0.06, -0.12], [0.20, 0.14], [-0.20, 0.12]]) {
    const t = 1 - (tx / HX) ** 2 - (tz / HZ) ** 2;
    const c = conem(0.05 + Math.abs(tx) * 0.06, 0.18, M.hair);
    c.position.set(tx, HCY + HY * Math.sqrt(Math.max(t, 0)) + 0.03, tz);
    c.rotation.set(tz * 1.4, 0, -tx * 1.4);
    head.add(c);
  }
  torso.add(head); P.head = head;

  // пост-обработка по миру: обводка для мультика, светящийся каркас для неона
  if (M._kind === 'toon' || M._kind === 'pixel') {
    const outM = new THREE.MeshBasicMaterial({ color: 0x1e2a18, side: THREE.BackSide });
    root.traverse((o) => {
      if (!o.isMesh || o.material.isMeshBasicMaterial || o.userData.noOut) return;
      o.castShadow = true;
      o.geometry.computeBoundingSphere();
      const size = o.geometry.boundingSphere.radius * Math.max(o.scale.x, o.scale.y, o.scale.z);
      if (size < 0.055) return;
      const out = new THREE.Mesh(o.geometry, outM);
      out.scale.setScalar(1 + 0.018 / size);
      o.add(out);
    });
  } else if (M._kind === 'neon') {
    root.traverse((o) => {
      if (!o.isMesh || o.userData.noOut || !o.material.userData?.wire) return;
      const wire = new THREE.Mesh(o.geometry, new THREE.MeshBasicMaterial({ color: o.material.userData.wire, wireframe: true, transparent: true, opacity: 0.85 }));
      wire.scale.setScalar(1.002);
      o.add(wire);
    });
    for (const eg of F.eyes) { // глаза светятся
      eg.children[0].material = new THREE.MeshBasicMaterial({ color: 0xfff6a8 });
      eg.children[1].material = new THREE.MeshBasicMaterial({ color: 0x2a1f00 });
    }
  } else {
    root.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  }
  return { group: root, body, P, F };
}

// ---------- анимация (одна на все миры) ----------
function tick(z, dt, t) {
  const { P, F, S } = z, a = S.amp;
  S.phase += dt * 4.4 * a;
  const ph = S.phase;
  P.legL.rotation.x = Math.sin(ph) * 0.55 * a;
  P.legR.rotation.x = Math.sin(ph + Math.PI) * 0.55 * a;
  z.body.position.y = Math.abs(Math.sin(ph)) * 0.055 * a;
  const sq = 1 + Math.sin(2 * ph + 0.7) * 0.035 * a + Math.sin(t * 2.1) * 0.012 * (1 - a);
  z.body.scale.set(1 + (1 - sq) * 0.55, sq, 1 + (1 - sq) * 0.55);
  z.body.rotation.x = -0.10 * a;
  z.body.rotation.z = Math.sin(ph) * 0.055 * a;
  const fwd = 1.28 * a + 1.1 * (1 - a);
  P.armL.rotation.x = fwd + Math.sin(ph + 0.4) * 0.16 * a + Math.sin(t * 1.3) * 0.05 * (1 - a);
  P.armR.rotation.x = fwd * 0.92 + Math.sin(ph + Math.PI * 0.9) * 0.19 * a + Math.cos(t * 1.1) * 0.05 * (1 - a);
  P.head.rotation.z = Math.sin(ph * 0.5 + 1) * 0.09 * a + Math.sin(t * 0.6) * 0.05 * (1 - a);
  P.head.rotation.x = Math.sin(2 * ph) * 0.05 * a - 0.04;
  if (S.attackT >= 0) {
    S.attackT += dt / 0.6;
    const k = S.attackT;
    if (k >= 1) { S.attackT = -1; F.smile.scale.set(1, 1, 1); }
    else {
      const up = Math.sin(Math.min(k * 2.4, 1) * Math.PI / 2);
      const chop = k > 0.42 ? Math.sin((k - 0.42) / 0.58 * Math.PI) : 0;
      P.armL.rotation.x = fwd + up * 0.8 - chop * 1.5;
      P.armR.rotation.x = fwd + up * 0.9 - chop * 1.6;
      z.body.position.z = -Math.sin(k * Math.PI) * 0.3;
      F.smile.scale.set(1, 1 + up * 0.8, 1);
    }
  } else z.body.position.z = 0;
  S.blinkAt -= dt;
  if (S.blinkAt <= 0) { S.blinkAt = 1.8 + Math.random() * 2.5; S.blinkT = 0; }
  if (S.blinkT >= 0) {
    S.blinkT += dt / 0.14;
    const b = S.blinkT >= 1 ? (S.blinkT = -1, 0) : Math.sin(S.blinkT * Math.PI);
    for (const e of F.eyes) e.scale.y = 1 - b * 0.92;
  }
  S.gazeAt -= dt;
  if (S.gazeAt <= 0) { S.gazeAt = 1.2 + Math.random() * 2; S.gazeTgt.set((Math.random() - 0.5) * 0.05, (Math.random() - 0.5) * 0.035); }
  S.gaze.lerp(S.gazeTgt, Math.min(1, dt * 5));
  for (const p of F.pupils) { p.position.x = S.gaze.x; p.position.y = S.gaze.y; }
}

// ---------- четыре мира ----------
const worlds = [];
function addWorld(cfg) {
  const env = new THREE.Group();
  env.visible = false;
  scene.add(env);
  const z = buildZombie(makeMats(cfg.mats));
  z.group.visible = false;
  z.S = { amp: 0, phase: Math.random() * 6, blinkAt: 2, blinkT: -1, gazeAt: 1, gaze: new THREE.Vector2(), gazeTgt: new THREE.Vector2(), attackT: -1 };
  scene.add(z.group);
  worlds.push({ ...cfg, env, z });
  return env;
}

// 1. Мультик
{
  const env = addWorld({ name: 'toon', mats: 'toon', bg: 0xbcd3e6, fog: [12, 24], pixelate: 0 });
  env.add(new THREE.HemisphereLight(0xd8ecff, 0x8aa070, 0.9));
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
  sun.position.set(4, 6, -3); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = sun.shadow.camera.bottom = -3;
  sun.shadow.camera.right = sun.shadow.camera.top = 3;
  const gr = new THREE.Mesh(new THREE.CircleGeometry(14, 48), toonM(0xcfe0c4));
  gr.rotation.x = -Math.PI / 2; gr.receiveShadow = true;
  env.add(sun, gr);
}
// 2. 8-бит
{
  const env = addWorld({ name: 'pixel', mats: 'pixel', bg: 0x66c7f0, fog: null, pixelate: 5 });
  env.add(new THREE.HemisphereLight(0xffffff, 0x9ad06a, 1.0));
  const sun = new THREE.DirectionalLight(0xffffff, 2.4);
  sun.position.set(4, 6, -3); sun.castShadow = true;
  sun.shadow.mapSize.set(512, 512);
  sun.shadow.camera.left = sun.shadow.camera.bottom = -3;
  sun.shadow.camera.right = sun.shadow.camera.top = 3;
  const gr = new THREE.Mesh(new THREE.CircleGeometry(14, 24), toonM(0x58c94e, grad2));
  gr.rotation.x = -Math.PI / 2; gr.receiveShadow = true;
  const sunSq = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4), new THREE.MeshBasicMaterial({ color: 0xfff06a }));
  sunSq.position.set(-4, 5.5, 6); sunSq.lookAt(0, 1, 0);
  env.add(sun, gr, sunSq);
}
// 3. Неон
{
  const env = addWorld({ name: 'neon', mats: 'neon', bg: 0x07030f, fog: [7, 18], pixelate: 0 });
  const grid = new THREE.GridHelper(30, 60, 0xff3df0, 0x3a1a66);
  grid.position.y = 0.001;
  const gr = new THREE.Mesh(new THREE.CircleGeometry(16, 32), new THREE.MeshBasicMaterial({ color: 0x0b0618 }));
  gr.rotation.x = -Math.PI / 2; gr.position.y = -0.01;
  const moonN = new THREE.Mesh(new THREE.CircleGeometry(1.3, 40), new THREE.MeshBasicMaterial({ color: 0xff9de2 }));
  moonN.position.set(3.5, 4.2, 8); moonN.lookAt(0, 1, 0);
  env.add(grid, gr, moonN);
}
// 4. Пластилин
{
  const env = addWorld({ name: 'clay', mats: 'clay', bg: 0xf2e4cf, fog: [10, 22], pixelate: 0 });
  env.add(new THREE.HemisphereLight(0xfff4e0, 0xc9b08a, 0.75));
  const key = new THREE.DirectionalLight(0xfff0dd, 2.6);
  key.position.set(3, 5, -4); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = key.shadow.camera.bottom = -3;
  key.shadow.camera.right = key.shadow.camera.top = 3;
  key.shadow.radius = 6;
  const fill = new THREE.DirectionalLight(0xcfe0ff, 0.7);
  fill.position.set(-4, 2, 3);
  const gr = new THREE.Mesh(new THREE.CircleGeometry(14, 48),
    new THREE.MeshStandardMaterial({ color: 0xe8d4b8, roughness: 1, bumpMap: clayBump, bumpScale: 0.5 }));
  gr.rotation.x = -Math.PI / 2; gr.receiveShadow = true;
  env.add(key, fill, gr);
}

// ---------- переключение миров ----------
let cur = -1;
function setWorld(i) {
  if (i === cur) return;
  cur = i;
  worlds.forEach((w, k) => { w.env.visible = w.z.group.visible = k === i; });
  const w = worlds[i];
  scene.background = new THREE.Color(w.bg);
  scene.fog = w.fog ? new THREE.Fog(w.bg, w.fog[0], w.fog[1]) : null;
  applySize();
  document.querySelectorAll('.g').forEach((b) => b.classList.toggle('on', +b.dataset.s === i));
}
function applySize() {
  const px = worlds[cur]?.pixelate || 0;
  if (px) {
    renderer.setPixelRatio(1);
    renderer.setSize(Math.floor(innerWidth / px), Math.floor(innerHeight / px), false);
    renderer.domElement.style.imageRendering = 'pixelated';
  } else {
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.domElement.style.imageRendering = 'auto';
  }
  renderer.domElement.style.width = '100vw';
  renderer.domElement.style.height = '100vh';
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
document.querySelectorAll('.g').forEach((b) => { b.onclick = () => setWorld(+b.dataset.s); });
setWorld(0);

// ---------- управление ----------
let MODE = 'walk';
for (const [id, mode] of Object.entries({ bIdle: 'idle', bWalk: 'walk' })) {
  document.getElementById(id).onclick = () => {
    MODE = mode;
    document.getElementById('bIdle').classList.toggle('on', mode === 'idle');
    document.getElementById('bWalk').classList.toggle('on', mode === 'walk');
  };
}
document.getElementById('bAtk').onclick = () => { const z = worlds[cur].z; if (z.S.attackT < 0) z.S.attackT = 0; };
let az = Math.PI + 0.4, el = 0.22, dist = 4.0, spin = true;
document.getElementById('bSpin').onclick = (e) => { spin = !spin; e.target.classList.toggle('on', spin); };
window.__proto = { setCam(a, e, d) { spin = false; az = a; if (e != null) el = e; if (d != null) dist = d; }, setWorld };
const look = new THREE.Vector3(0, 0.95, 0);
renderer.domElement.addEventListener('pointerdown', () => {
  const move = (ev) => { az -= ev.movementX * 0.006; el = THREE.MathUtils.clamp(el + ev.movementY * 0.005, -0.05, 1.15); };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});
addEventListener('wheel', (e) => { dist = THREE.MathUtils.clamp(dist + e.deltaY * 0.004, 1.8, 9); });
addEventListener('resize', applySize);

// ---------- цикл ----------
const lerp = (a, b, k) => a + (b - a) * k;
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (spin) az += dt * 0.25;
  const z = worlds[cur].z;
  z.S.amp = lerp(z.S.amp, MODE === 'walk' ? 1 : 0, Math.min(1, dt * 6));
  tick(z, dt, now / 1000);
  camera.position.set(look.x + Math.sin(az) * Math.cos(el) * dist, look.y + Math.sin(el) * dist, look.z + Math.cos(az) * Math.cos(el) * dist);
  camera.lookAt(look);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
