<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прототип: Pixar-зомби на three.js</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bcd3e6; font-family: system-ui, sans-serif; }
  #ui { position: fixed; left: 12px; top: 12px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 2; }
  #ui button {
    border: 0; border-radius: 12px; padding: 10px 16px; font-size: 16px; cursor: pointer;
    background: #ffffffd9; box-shadow: 0 2px 6px #0002; font-weight: 600;
  }
  #ui button.on { background: #7ed957; color: #143a0a; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #33506b; font-size: 13px; z-index: 2; }
</style>
</head>
<body>
<div id="ui">
  <button id="bIdle">🧟 Стоит</button>
  <button id="bWalk" class="on">🚶 Бредёт</button>
  <button id="bAtk">💥 Атака!</button>
  <button id="bSpin" class="on">🔄 Камера</button>
</div>
<div id="hint">мышью — крутить, колесом — приближать</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

// ---------- рендер, свет, сцена ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd3e6);
scene.fog = new THREE.Fog(0xbcd3e6, 8, 16);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 50);

scene.add(new THREE.HemisphereLight(0xd8ecff, 0x8aa070, 0.9));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(3, 5, -2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = sun.shadow.camera.bottom = -3;
sun.shadow.camera.right = sun.shadow.camera.top = 3;
scene.add(sun);

// тот же приём, что toonMat в renderkit.js
const grad = new THREE.DataTexture(new Uint8Array([90, 160, 215, 255]), 4, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter;
grad.needsUpdate = true;
const matCache = new Map();
const toon = (c) => {
  if (!matCache.has(c)) matCache.set(c, new THREE.MeshToonMaterial({ color: c, gradientMap: grad, dithering: true }));
  return matCache.get(c);
};

const ground = new THREE.Mesh(new THREE.CircleGeometry(9, 48), toon(0xcfe0c4));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- палитра ----------
const SKIN = 0x7ed957, SKIN_D = 0x55a83e, HAIR = 0x3e7a2e, SHIRT = 0x7a6fd0,
      PANTS = 0x4a4e69, SHOES = 0x8b5e3c, SOLE = 0x4e342e, GOLD = 0xd9a441,
      BLUSH = 0xa8e063, DARK = 0x20261e, MOUTH = 0x2c4426, WHITE = 0xffffff;

// ---------- помощники ----------
const sph = (r, c, w = 20, h = 14) => new THREE.Mesh(new THREE.SphereGeometry(r, w, h), toon(c));
const boxm = (w, h, d, c) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toon(c));
const caps = (r, l, c) => new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 5, 14), toon(c));
const torус = (R, r, c) => { const m = new THREE.Mesh(new THREE.TorusGeometry(R, r, 10, 32), toon(c)); m.rotation.x = Math.PI / 2; return m; };
const conem = (r, h, c) => new THREE.Mesh(new THREE.ConeGeometry(r, h, 10), toon(c));

// рваный край: зигзаг по нижнему кольцу цилиндра
function jag(geo, yMin, base, amp, freq) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    if (p.getY(i) < yMin) {
      const a = Math.atan2(p.getZ(i), p.getX(i));
      p.setY(i, p.getY(i) - base - amp * Math.abs(Math.sin(freq * a + 0.7)));
      p.setX(i, p.getX(i) * 1.06);
      p.setZ(i, p.getZ(i) * 1.06);
    }
  }
  geo.computeVertexNormals();
  return geo;
}

// ---------- сборка зомби (стоит на y=0, смотрит в -Z, части как в characters.js) ----------
function buildPixarZombie() {
  const root = new THREE.Group();
  const body = new THREE.Group(); body.name = 'body';
  root.add(body);
  const parts = {}, fx = {};

  // ноги
  for (const s of [-1, 1]) {
    const g = new THREE.Group();
    g.name = s < 0 ? 'legL' : 'legR';
    g.position.set(0.15 * s, 0.66, 0);
    const pant = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.115, 0.42, 20), toon(PANTS));
    pant.position.y = -0.18;
    const cuff = torус(0.115, 0.033, PANTS); cuff.position.y = -0.40;
    const ankle = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.16, 12), toon(SKIN));
    ankle.position.y = -0.47;
    const sole = boxm(0.25, 0.06, 0.42, SOLE); sole.position.set(0, -0.625, -0.03);
    const shoe = sph(1, SHOES); shoe.scale.set(0.115, 0.10, 0.20); shoe.position.set(0, -0.56, -0.03);
    const toe = sph(1, WHITE); toe.scale.set(0.075, 0.07, 0.075); toe.position.set(0, -0.555, -0.185);
    g.add(pant, cuff, ankle, sole, shoe, toe);
    body.add(g); parts[g.name] = g;
  }

  // туловище
  const torso = new THREE.Group(); torso.name = 'torso';
  torso.position.y = 0.66;
  const shirt = new THREE.Mesh(jag(new THREE.CylinderGeometry(0.29, 0.33, 0.55, 48, 1), -0.26, 0.02, 0.045, 3.5), toon(SHIRT));
  shirt.scale.set(1.05, 1, 0.88); shirt.position.y = 0.19;
  const belt = torус(0.315, 0.03, DARK); belt.scale.set(1.05, 0.88, 1); belt.position.y = -0.02;
  const buckle = boxm(0.07, 0.06, 0.035, GOLD); buckle.position.set(0, -0.02, -0.30);
  const b1 = sph(0.022, DARK, 10, 8); b1.position.set(0, 0.31, -0.276);
  const b2 = sph(0.022, DARK, 10, 8); b2.position.set(0, 0.19, -0.288);
  const collar = torус(0.135, 0.045, 0x5f55b8); collar.position.y = 0.44;
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 0.18, 14), toon(SKIN));
  neck.position.y = 0.48;
  torso.add(shirt, belt, buckle, b1, b2, collar, neck);
  body.add(torso); parts.torso = torso;

  // руки (собраны вниз, вперёд поднимает анимация)
  for (const s of [-1, 1]) {
    const g = new THREE.Group();
    g.name = s < 0 ? 'armL' : 'armR';
    g.position.set(0.33 * s, 0.40, -0.03);
    const shoulder = sph(0.115, SHIRT);
    const sleeve = new THREE.Mesh(jag(new THREE.CylinderGeometry(0.095, 0.10, 0.28, 20, 1), -0.13, 0.01, 0.03, 4), toon(SHIRT));
    sleeve.position.y = -0.12;
    const fore = caps(0.075, 0.20, SKIN); fore.position.y = -0.36;
    const palm = sph(0.095, SKIN); palm.scale.set(1, 1.25, 0.7); palm.position.y = -0.53;
    g.add(shoulder, sleeve, fore, palm);
    for (let i = 0; i < 3; i++) {
      const f = sph(0.028, SKIN, 10, 8);
      f.scale.set(1, 2.1, 1.05);
      f.position.set((i - 1) * 0.055, i === 1 ? -0.655 : -0.635, 0);
      g.add(f);
    }
    const thumb = sph(0.028, SKIN, 10, 8);
    thumb.scale.set(1.9, 1, 1.05);
    thumb.position.set(-s * 0.10, -0.55, 0);
    g.add(thumb);
    torso.add(g); parts[g.name] = g;
  }

  // голова: эллипсоид, лицо строим по его поверхности
  const head = new THREE.Group(); head.name = 'head';
  head.position.y = 0.52; // мировая 1.18 — шея
  const HX = 0.44, HY = 0.38, HZ = 0.42, HCY = 0.30;
  const fz = (x, y, off = 0) => { // z поверхности лица (перед = -Z)
    const t = 1 - (x / HX) ** 2 - ((y - HCY) / HY) ** 2;
    return -(HZ * Math.sqrt(Math.max(t, 0)) + off);
  };
  const skull = sph(1, SKIN, 36, 26); skull.scale.set(HX, HY, HZ); skull.position.y = HCY;
  const cheeks = sph(1, SKIN, 28, 20); cheeks.scale.set(0.34, 0.24, 0.30); cheeks.position.set(0, 0.14, -0.05);
  head.add(skull, cheeks);
  for (const s of [-1, 1]) {
    const ear = sph(1, SKIN, 12, 10); ear.scale.set(0.055, 0.10, 0.08); ear.position.set(0.455 * s, HCY, 0.02);
    const earIn = sph(1, SKIN_D, 10, 8); earIn.scale.set(0.02, 0.055, 0.045); earIn.position.set(0.478 * s, HCY, 0);
    const blush = sph(1, BLUSH, 12, 10); blush.scale.set(0.075, 0.05, 0.035);
    blush.position.set(0.27 * s, 0.20, fz(0.27 * s, 0.20, 0.004));
    ear.userData.noOut = earIn.userData.noOut = blush.userData.noOut = true;
    head.add(ear, earIn, blush);
  }
  const nose = sph(1, SKIN, 14, 12); nose.scale.set(0.075, 0.055, 0.06); nose.position.set(0, 0.27, fz(0, 0.27, 0.02));
  head.add(nose);

  // глаза разного размера + зрачки с бликами, сонное веко
  fx.pupils = []; fx.eyes = [];
  for (const [s, r, rp] of [[1, 0.11, 0.048], [-1, 0.085, 0.040]]) {
    const eg = new THREE.Group();
    eg.position.set(0.16 * s, s > 0 ? 0.37 : 0.35, fz(0.16 * s, 0.36) + r * 0.42);
    const white = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 18), new THREE.MeshToonMaterial({ color: WHITE, gradientMap: grad }));
    const pupil = sph(rp, DARK, 16, 12); pupil.position.z = -(r - 0.012);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 6), new THREE.MeshBasicMaterial({ color: WHITE }));
    glint.position.set(0.035, 0.04, -(r + 0.002));
    eg.add(white, pupil, glint);
    head.add(eg); fx.eyes.push(eg); fx.pupils.push(pupil);
  }
  const lid = sph(1, SKIN, 20, 14); lid.scale.set(0.118, 0.075, 0.118);
  lid.position.set(0.16, 0.455, fz(0.16, 0.38) + 0.05);
  head.add(lid);

  // брови с разным наклоном
  const browL = boxm(0.11, 0.03, 0.035, HAIR); browL.position.set(0.17, 0.52, fz(0.17, 0.52, 0.02)); browL.rotation.set(-0.3, 0, 0.17);
  const browR = boxm(0.10, 0.03, 0.035, HAIR); browR.position.set(-0.16, 0.49, fz(-0.16, 0.49, 0.02)); browR.rotation.set(-0.3, 0, -0.28);
  head.add(browL, browR);

  // кривая улыбка — трубка по кривой, повторяющей поверхность лица
  const mc = new THREE.Vector3(0.005, 0.155, fz(0.005, 0.15, 0.012));
  const smilePts = [[-0.115, 0.185], [-0.05, 0.14], [0.01, 0.125], [0.08, 0.14], [0.13, 0.19]]
    .map(([px, py]) => new THREE.Vector3(px, py, fz(px, py, 0.012)).sub(mc));
  const smileGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(smilePts), 20, 0.019, 8);
  const smile = new THREE.Mesh(smileGeo, toon(MOUTH));
  smile.position.copy(mc);
  const t1 = boxm(0.05, 0.06, 0.035, WHITE); t1.position.set(0.06, 0.095, fz(0.06, 0.095, 0.01)); t1.rotation.z = 0.08;
  const t2 = boxm(0.045, 0.055, 0.035, WHITE); t2.position.set(-0.04, 0.10, fz(-0.04, 0.10, 0.01)); t2.rotation.z = -0.06;
  head.add(smile, t1, t2); fx.smile = smile;

  // вихры и заплатка
  fx.tufts = [];
  const tufts = [[0, 0.06], [0.13, -0.03], [-0.14, 0.05], [0.07, 0.18], [-0.06, -0.12], [0.20, 0.14], [-0.20, 0.12], [0.24, -0.06]];
  for (const [tx, tz] of tufts) {
    const t = 1 - (tx / HX) ** 2 - (tz / HZ) ** 2;
    const ty = HCY + HY * Math.sqrt(Math.max(t, 0));
    const c = conem(0.05 + Math.abs(tx) * 0.06, 0.16 + Math.abs(Math.sin(tx * 9 + tz * 7)) * 0.10, HAIR);
    c.position.set(tx, ty + 0.03, tz);
    c.rotation.set(tz * 1.4, 0, -tx * 1.4);
    head.add(c); fx.tufts.push(c);
  }
  const patch = sph(1, SKIN_D, 14, 10); patch.scale.set(0.10, 0.035, 0.10);
  patch.position.set(-0.27, 0.58, 0.11); patch.rotation.set(-0.15, 0, 0.55);
  head.add(patch);

  torso.add(head); parts.head = head;

  // тени + дешёвая обводка (как outline в bakeRig)
  const outM = new THREE.MeshBasicMaterial({ color: 0x1e2a18, side: THREE.BackSide });
  root.traverse((o) => {
    if (!o.isMesh || o.material.isMeshBasicMaterial || o.userData.noOut) return;
    o.castShadow = true;
    o.geometry.computeBoundingSphere();
    const size = o.geometry.boundingSphere.radius * Math.max(o.scale.x, o.scale.y, o.scale.z);
    if (size < 0.055) return;
    const out = new THREE.Mesh(o.geometry, outM);
    out.scale.setScalar(1 + 0.018 / size);
    o.add(out);
  });

  return { group: root, body, parts, fx };
}

const z = buildPixarZombie();
scene.add(z.group);

// ---------- анимация ----------
const S = {
  mode: 'walk', amp: 0, phase: 0,
  blinkAt: 1.5, blinkT: -1,
  gazeAt: 1, gaze: new THREE.Vector2(), gazeTgt: new THREE.Vector2(),
  attackT: -1,
};
const lerp = (a, b, k) => a + (b - a) * k;

function update(dt, t) {
  const P = z.parts, F = z.fx;
  S.amp = lerp(S.amp, S.mode === 'walk' ? 1 : 0, Math.min(1, dt * 6));
  const a = S.amp;
  S.phase += dt * 4.4 * a;
  const ph = S.phase;

  // ноги — ковыляние
  P.legL.rotation.x = Math.sin(ph) * 0.55 * a;
  P.legR.rotation.x = Math.sin(ph + Math.PI) * 0.55 * a;

  // подскок + сквош-и-стретч
  const bounce = Math.abs(Math.sin(ph));
  z.body.position.y = bounce * 0.055 * a;
  const sq = 1 + Math.sin(2 * ph + 0.7) * 0.035 * a + Math.sin(t * 2.1) * 0.012 * (1 - a); // дыхание в покое
  z.body.scale.set(1 + (1 - sq) * 0.55, sq, 1 + (1 - sq) * 0.55);
  z.body.rotation.x = -0.10 * a;                    // наклон вперёд
  z.body.rotation.z = Math.sin(ph) * 0.055 * a;     // перевалочка

  // руки: вперёд, вразнобой болтаются
  const fwd = 1.28 * a + 1.1 * (1 - a);
  P.armL.rotation.x = fwd + Math.sin(ph + 0.4) * 0.16 * a + Math.sin(t * 1.3) * 0.05 * (1 - a);
  P.armR.rotation.x = fwd * 0.92 + Math.sin(ph + Math.PI * 0.9) * 0.19 * a + Math.cos(t * 1.1) * 0.05 * (1 - a);
  P.armL.rotation.z = 0.08; P.armR.rotation.z = -0.10;

  // голова: покачивание и наклон набок
  P.head.rotation.z = Math.sin(ph * 0.5 + 1) * 0.09 * a + Math.sin(t * 0.6) * 0.05 * (1 - a);
  P.head.rotation.x = Math.sin(2 * ph) * 0.05 * a - 0.04;

  // атака — бросок вперёд с замахом
  if (S.attackT >= 0) {
    S.attackT += dt / 0.6;
    const k = S.attackT;
    if (k >= 1) { S.attackT = -1; F.smile.scale.set(1, 1, 1); }
    else {
      const up = Math.sin(Math.min(k * 2.4, 1) * Math.PI / 2);          // замах
      const chop = k > 0.42 ? Math.sin((k - 0.42) / 0.58 * Math.PI) : 0; // удар
      P.armL.rotation.x = fwd + up * 0.8 - chop * 1.5;
      P.armR.rotation.x = fwd + up * 0.9 - chop * 1.6;
      z.body.position.z = -Math.sin(k * Math.PI) * 0.3;
      z.body.rotation.x = -0.1 - chop * 0.25;
      P.head.rotation.x = -0.2 * up + chop * 0.3;
      F.smile.scale.set(1, 1 + up * 0.8, 1); // разевает рот
    }
  } else z.body.position.z = 0;

  // моргание
  S.blinkAt -= dt;
  if (S.blinkAt <= 0) { S.blinkAt = 1.8 + Math.random() * 2.5; S.blinkT = 0; }
  if (S.blinkT >= 0) {
    S.blinkT += dt / 0.14;
    const b = S.blinkT >= 1 ? (S.blinkT = -1, 0) : Math.sin(S.blinkT * Math.PI);
    for (const e of F.eyes) e.scale.y = 1 - b * 0.92;
  }

  // зрачки блуждают
  S.gazeAt -= dt;
  if (S.gazeAt <= 0) { S.gazeAt = 1.2 + Math.random() * 2; S.gazeTgt.set((Math.random() - 0.5) * 0.055, (Math.random() - 0.5) * 0.04); }
  S.gaze.lerp(S.gazeTgt, Math.min(1, dt * 5));
  for (const p of F.pupils) { p.position.x = S.gaze.x; p.position.y = S.gaze.y; }
}

// ---------- камера-орбита ----------
let az = 0.5, el = 0.28, dist = 4.2, spin = true;
// дебаг из консоли: __proto.setCam(Math.PI, 0.2, 3)
window.__proto = { setCam(a, e, d) { spin = false; az = a; if (e != null) el = e; if (d != null) dist = d; }, S };
const look = new THREE.Vector3(0, 0.95, 0);
renderer.domElement.addEventListener('pointerdown', (e) => {
  const move = (ev) => { az -= ev.movementX * 0.006; el = THREE.MathUtils.clamp(el + ev.movementY * 0.005, -0.1, 1.2); };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});
addEventListener('wheel', (e) => { dist = THREE.MathUtils.clamp(dist + e.deltaY * 0.004, 2, 9); });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- кнопки ----------
const btns = { bIdle: 'idle', bWalk: 'walk' };
for (const [id, mode] of Object.entries(btns)) {
  document.getElementById(id).onclick = () => {
    S.mode = mode;
    document.getElementById('bIdle').classList.toggle('on', mode === 'idle');
    document.getElementById('bWalk').classList.toggle('on', mode === 'walk');
  };
}
document.getElementById('bAtk').onclick = () => { if (S.attackT < 0) S.attackT = 0; };
document.getElementById('bSpin').onclick = (e) => { spin = !spin; e.target.classList.toggle('on', spin); };

// ---------- цикл ----------
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (spin) az += dt * 0.25;
  update(dt, now / 1000);
  camera.position.set(look.x + Math.sin(az) * Math.cos(el) * dist, look.y + Math.sin(el) * dist, look.z + Math.cos(az) * Math.cos(el) * dist);
  camera.lookAt(look);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
